<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมเศรษฐี อารยธรรมกรีกโบราณ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0b3d91;
            --gold: #d4af37;
            --light-bg: #f9f6f0;
            --dark-text: #1a1a1a;
            --board-bg: #e5e0d8;
        }

        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--primary-blue);
            color: var(--dark-text);
            overflow: hidden;
            height: 100vh;
        }

        h1, h2, h3 { font-weight: 700; }

        /* --- Setup Screen --- */
        #setup-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background-color: var(--light-bg);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
        }
        .setup-box {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 4px solid var(--gold);
            text-align: center; width: 90%; max-width: 600px;
        }
        .setup-box h1 { font-size: 42px; color: var(--primary-blue); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { font-size: 22px; font-weight: bold; display: block; margin-bottom: 8px; }
        select, input[type="text"] { width: 100%; padding: 10px; font-size: 20px; border: 2px solid #ccc; border-radius: 8px; }
        .btn {
            background-color: var(--gold); color: white; border: none; padding: 12px 28px;
            font-size: 22px; font-weight: bold; border-radius: 8px; cursor: pointer;
            transition: 0.3s; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .btn:hover { background-color: #bfa12b; transform: scale(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* --- Game Screen Layout --- */
        #game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            padding: 8px;
            gap: 8px;
            background: var(--primary-blue);
        }

        /* ===== CHANGE 4: Scoreboard on top ===== */
        #top-scoreboard {
            background: rgba(255,255,255,0.97);
            border: 3px solid var(--gold);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #top-scoreboard h2 {
            color: var(--primary-blue);
            font-size: 18px;
            white-space: nowrap;
            border-right: 2px solid var(--gold);
            padding-right: 12px;
            margin-right: 4px;
        }
        .score-cards-row {
            display: flex;
            gap: 10px;
            flex: 1;
            overflow-x: auto;
        }
        .score-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            white-space: nowrap;
            transition: 0.3s;
            position: relative;
            min-width: 150px;
        }
        .score-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212,175,55,0.7);
            background: #fffbf0;
        }
        .score-dot {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 2px solid #000;
            flex-shrink: 0;
        }
        .score-name { font-weight: bold; color: var(--primary-blue); }
        .score-money { color: #2e7d32; font-weight: bold; display: flex; align-items: center; gap: 4px; }

        .float-text {
            position: absolute; right: 8px; top: 4px;
            font-size: 18px; font-weight: bold; opacity: 0; pointer-events: none; z-index: 50;
        }
        .float-up   { color: #2e7d32; animation: floatUpAnim 2s ease-out forwards; }
        .float-down { color: #d32f2f; animation: floatDownAnim 2s ease-out forwards; }
        @keyframes floatUpAnim   { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-30px)} }
        @keyframes floatDownAnim { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(30px)} }

        /* --- Main game area: board only --- */
        #main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        /* --- Board --- */
        #board-container {
            background: var(--board-bg);
            border: 5px solid var(--gold);
            border-radius: 15px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 2px;
            background-color: #333;
            padding: 2px;
            height: 100%;
            aspect-ratio: 1 / 1;
            max-height: calc(100vh - 100px);
        }

        .cell {
            background-color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; font-size: 13px;
            position: relative; padding: 2px; overflow: hidden;
        }
        .cell-header {
            width: 100%; height: 22%;
            position: absolute; top: 0; left: 0;
            border-bottom: 1px solid #333;
        }
        .color-easy   { background-color: #81c784; }
        .color-medium { background-color: #64b5f6; }
        .color-hard   { background-color: #e57373; }
        .color-special{ background-color: #ffd54f; }

        .cell-content { margin-top: 22%; font-size: 13px; font-weight: bold; line-height: 1.1; z-index: 2; }
        .cell-emoji   { font-size: 18px; line-height: 1; }
        .cell-price   { font-size: 12px; color: #555; margin-top: 2px; }
        .corner       { font-size: 14px; background-color: #e0e0e0; }
        .corner .cell-content { margin-top: 0; }
        .owner-banner { position: absolute; bottom: 0; left: 0; width: 100%; height: 13%; z-index: 5; }

        /* ===== CHANGE 2 & 3: Board center with background image + dice centered ===== */
        #board-center {
            grid-column: 2 / 9;
            grid-row: 2 / 9;
            /* Greek landscape background */
            background-color: #a8d5a2;
            background-image: 
                linear-gradient(rgba(100, 180, 100, 0.5), rgba(80, 160, 80, 0.5)),
                url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Parthenon-athens.jpg/1200px-Parthenon-athens.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        .game-title-center {
            background: rgba(255,255,255,0.92);
            padding: 8px 24px;
            border-radius: 10px;
            border: 3px solid var(--gold);
            font-size: 24px;
            color: var(--primary-blue);
            font-weight: bold;
            text-align: center;
        }

        /* Status log */
        #status-log {
            background: rgba(255,255,255,0.95);
            width: 85%;
            min-height: 60px;
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 18px;
            overflow-y: auto;
            text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ===== CHANGE 3: Dice centered below title, status at bottom ===== */
        #dice-module {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.93);
            padding: 12px 20px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            gap: 8px;
        }
        .dice {
            width: 64px; height: 64px;
            background: white; border: 2px solid black;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 32px; font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Token */
        .token {
            width: 22px; height: 22px; border-radius: 50%; position: absolute;
            border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10; transition: all 0.5s ease-in-out;
        }

        /* --- Modals --- */
        .modal-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; padding: 25px; border-radius: 15px;
            border: 4px solid var(--gold); width: 90%; max-width: 600px;
            text-align: center; font-size: 20px;
        }
        .modal-box h2 { color: var(--primary-blue); font-size: 30px; margin-bottom: 12px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .option-btn {
            background: #f0f0f0; border: 2px solid #ccc; padding: 12px;
            font-size: 18px; border-radius: 8px; cursor: pointer; transition: 0.2s;
            font-family: 'Sarabun', sans-serif;
        }
        .option-btn:hover { background: var(--gold); color: white; border-color: var(--gold); }
        .modal-controls { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
    </style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
    <div class="setup-box">
        <h1>🏛️ เกมเศรษฐี อารยธรรมกรีก</h1>
        <div class="form-group">
            <label>จำนวนผู้เล่น (2-4 คน):</label>
            <select id="player-count" onchange="generatePlayerInputs()">
                <option value="2">2 คน</option>
                <option value="3">3 คน</option>
                <option value="4">4 คน</option>
            </select>
        </div>
        <div id="player-inputs"></div>
        <button class="btn" onclick="startGame()">เข้าสู่โลกแห่งกรีก <i class="fa-solid fa-play"></i></button>
    </div>
</div>

<!-- Game Screen -->
<div id="game-screen">

    <!-- CHANGE 4: Top scoreboard -->
    <div id="top-scoreboard">
        <h2>🏆 ข้อมูลผู้เล่น</h2>
        <div class="score-cards-row" id="score-cards-row">
            <!-- score cards injected here -->
        </div>
    </div>

    <!-- Board area -->
    <div id="main-area">
        <div id="board-container">
            <!-- CHANGE 2 & 3: Center with background + dice in middle -->
            <div id="board-center">
                <div class="game-title-center">🏛️ มหากาพย์กรีกโบราณ ⚡</div>

                <!-- Dice in center -->
                <div id="dice-module">
                    <div id="dice-display" class="dice"><i class="fa-solid fa-dice"></i></div>
                    <button id="btn-roll" class="btn" onclick="rollDice()">🎲 ทอยลูกเต๋า</button>
                </div>

                <!-- Status log at bottom of center -->
                <div id="status-log">ยินดีต้อนรับสู่ยุคแห่งนครรัฐ! 🏛️</div>
            </div>
        </div>
    </div>
</div>

<!-- Question Modal -->
<div id="question-modal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="q-title">🧠 บททดสอบแห่งปัญญา</h2>
        <p id="q-text"></p>
        <div id="q-options" class="options-grid"></div>
    </div>
</div>

<!-- Alert Modal -->
<div id="alert-modal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="alert-title">แจ้งเตือน</h2>
        <p id="alert-text"></p>
        <div id="alert-controls" class="modal-controls">
            <button class="btn" onclick="closeAlertModal()">ตกลง</button>
        </div>
    </div>
</div>

<script>
    /* ================= Question Bank ================= */
    const questionBank = {
        easy: [
            { q: "อารยธรรมใดที่นักโบราณคดีถือว่าเป็น 'อารยธรรมแรก' ที่ยิ่งใหญ่ของกรีก?", options: ["อารยธรรมไมโนอัน","อารยธรรมไมซีเนียน","สปาร์ตา","เอเธนส์"], a: 0 },
            { q: "การแข่งขันกีฬาที่เริ่มขึ้นเมื่อ 776 ปีก่อนคริสต์ศักราชในกรีก คืออะไร?", options: ["กีฬาโอลิมปิก","กีฬาพิเธียน","เนเมียนเกมส์","อิสเมียนเกมส์"], a: 0 },
            { q: "อาคารที่ถือเป็นสัญลักษณ์และโด่งดังที่สุดเมื่อพูดถึงอารยธรรมกรีกคืออะไร?", options: ["วิหารพาร์เธนอน","โคลอสเซียม","แพนธีออน","ซิกกูแรต"], a: 0 },
            { q: "มหากาพย์ชื่อดังที่เขียนขึ้นในยุคถัดจากยุคมืด คือเรื่องอะไร?", options: ["อีเลียด และ โอดีสซี","กิลกาเมช","อีเนียด","มหาภารตะ"], a: 0 },
            { q: "กษัตริย์ผู้มีชื่อเสียงจากการนำทัพไปรบกับกรุงทรอยในยุคไมซีเนียน คือใคร?", options: ["กษัตริย์อากาเมมนอน","ลีโอไนดัส","อเล็กซานเดอร์","เพริคลีส"], a: 0 }
        ],
        medium: [
            { q: "อารยธรรมไมโนอันมีศูนย์กลางความเจริญอยู่ที่เกาะใด?", options: ["เกาะครีต","ไซปรัส","ซิซิลี","โรดส์"], a: 0 },
            { q: "เพราะเหตุใดอารยธรรมไมโนอันจึงเชื่อกันว่าล่มสลายลงในทฤษฎีที่น่าเชื่อถือที่สุด?", options: ["ภูเขาไฟระเบิดและสึนามิ","โรคระบาดครั้งใหญ่","การรุกรานของเปอร์เซีย","สงครามกลางเมือง"], a: 0 },
            { q: "นครรัฐ (City-state) ของกรีกโบราณมีคำเรียกเฉพาะว่าอะไร?", options: ["โพลิส (Polis)","อะโครโพลิส","อโกรา","เดม (Deme)"], a: 0 },
            { q: "สงครามที่เกิดจากการตกลงกันไม่ได้ระหว่างเอเธนส์และสปาร์ตา คือสงครามอะไร?", options: ["สงครามเพโลพอนนีเซียน","สงครามเปอร์เซีย","สงครามพิวนิก","สงครามกรุงทรอย"], a: 0 },
            { q: "ใครคืออาจารย์ของพระเจ้าอเล็กซานเดอร์มหาราช?", options: ["อริสโตเติล","โสกราตีส","เพลโต","พีทาโกรัส"], a: 0 }
        ],
        hard: [
            { q: "อักษรโบราณของอารยธรรมไมโนอันที่นักวิชาการยังอ่านไม่ออกคืออะไร?", options: ["อักษรลิเนียร์ เอ","อักษรลิเนียร์ บี","ไฮโรกลิฟิก","คูนิฟอร์ม"], a: 0 },
            { q: "อักษรที่พบการบูชาเทพเจ้า เช่น ซุส เฮร่า โพไซดอน ในยุคไมซีเนียน เรียกว่าอะไร?", options: ["อักษรลิเนียร์ บี","อักษรลิเนียร์ เอ","ฟินิเชียน","ละติน"], a: 0 },
            { q: "สาเหตุที่ทำให้นครรัฐกรีกจับมือกันรบที่ยุทธการนาวีซาลามิสคืออะไร?", options: ["การรุกรานจากข้าศึกภายนอก (เปอร์เซีย)","การขาดแคลนทรัพยากร","ความขัดแย้งทางศาสนา","การขยายอำนาจของสปาร์ตา"], a: 0 },
            { q: "ราชวงศ์ของคลีโอพัตราในยุคเฮเลนิสติก เรียกว่าอะไร?", options: ["ราชวงศ์ทอเลมี","ราชวงศ์เซลิวซิด","ราชวงศ์แอนติโกนิด","ราชวงศ์แอตทาลิด"], a: 0 },
            { q: "ชื่อภาษาที่ชาวกรีกในยุคเฮเลนิสติกส์ใช้สื่อสารกันอย่างแพร่หลายคืออะไร?", options: ["ภาษาคอยนี (Koine Greek)","ภาษาแอตติก (Attic Greek)","ภาษาดอริก","ภาษาไอโอนิก"], a: 0 }
        ]
    };

    /* ================= CHANGE 1: Board Layout with Emojis ================= */
    const boardLayout = [
        { name: "🚀 จุดเริ่มต้น<br>(รับ 200)", type: "corner" },
        { name: "🏝️ เกาะครีต",        type: "property", price: 100, level: "easy",   hasQ: true  },
        { name: "🏛️ วิหารคนอสซอส",    type: "property", price: 120, level: "easy",   hasQ: true  },
        { name: "📦 หีบสมบัติ",        type: "chance",   colorClass: "color-special" },
        { name: "⚔️ กรุงทรอย",         type: "property", price: 140, level: "easy",   hasQ: false },
        { name: "🦁 ไมซีเนีย",         type: "property", price: 150, level: "easy",   hasQ: true  },
        { name: "💰 ภาษีสภา<br>(จ่าย 100)", type: "tax", amount: 100 },
        { name: "🌊 ไอโอเนีย",         type: "property", price: 160, level: "easy",   hasQ: true  },
        { name: "👁️ ยมโลก<br>(Hades)", type: "corner"  },
        { name: "🏃 มาราธอน",          type: "property", price: 180, level: "medium", hasQ: true  },
        { name: "📦 หีบสมบัติ",        type: "chance",   colorClass: "color-special" },
        { name: "🛡️ เทอร์โมพิลี",     type: "property", price: 200, level: "medium", hasQ: true  },
        { name: "⚓ ซาลามิส",          type: "property", price: 220, level: "medium", hasQ: true  },
        { name: "💰 ภาษีสภา<br>(จ่าย 100)", type: "tax", amount: 100 },
        { name: "🏺 โครินธ์",          type: "property", price: 240, level: "medium", hasQ: false },
        { name: "🔱 ธีบส์",            type: "property", price: 240, level: "medium", hasQ: true  },
        { name: "🔮 วิหารเดลฟี<br>(จุดพัก)", type: "corner" },
        { name: "⚔️ สปาร์ตา",         type: "property", price: 260, level: "medium", hasQ: true  },
        { name: "📦 หีบสมบัติ",        type: "chance",   colorClass: "color-special" },
        { name: "🏟️ อาร์กอส",         type: "property", price: 260, level: "medium", hasQ: false },
        { name: "💰 ภาษีสภา<br>(จ่าย 100)", type: "tax", amount: 100 },
        { name: "🦉 เอเธนส์",          type: "property", price: 300, level: "medium", hasQ: true  },
        { name: "🗿 เกาะโรดส์",        type: "property", price: 300, level: "hard",   hasQ: true  },
        { name: "📦 หีบสมบัติ",        type: "chance",   colorClass: "color-special" },
        { name: "💀 ไปยมโลก!",         type: "corner"  },
        { name: "🌋 ซีราคิวส์",        type: "property", price: 320, level: "hard",   hasQ: true  },
        { name: "💰 ภาษีสภา<br>(จ่าย 100)", type: "tax", amount: 100 },
        { name: "🌺 เอเฟซัส",          type: "property", price: 350, level: "hard",   hasQ: false },
        { name: "📜 เพอร์กามัม",       type: "property", price: 350, level: "hard",   hasQ: true  },
        { name: "📦 หีบสมบัติ",        type: "chance",   colorClass: "color-special" },
        { name: "👑 มาซิโดเนีย",       type: "property", price: 400, level: "hard",   hasQ: true  },
        { name: "🌟 อเล็กซานเดรีย",   type: "property", price: 400, level: "hard",   hasQ: true  }
    ];

    const playerColors = ['#e53935','#1e88e5','#43a047','#fdd835'];
    let players = [];
    let currentPlayerIndex = 0;
    let gameState = 'playing';
    let currentPropertyToBuy = null;

    /* ================= Setup ================= */
    function generatePlayerInputs() {
        const count = document.getElementById('player-count').value;
        const container = document.getElementById('player-inputs');
        container.innerHTML = '';
        for(let i=1; i<=count; i++) {
            container.innerHTML += `
                <div class="form-group">
                    <label>ชื่อผู้เล่นที่ ${i}:</label>
                    <input type="text" id="p-name-${i}" placeholder="กรอกชื่อ..." value="ผู้เล่น ${i}">
                </div>`;
        }
    }

    function startGame() {
        const count = document.getElementById('player-count').value;
        players = [];
        for(let i=1; i<=count; i++) {
            const name = document.getElementById(`p-name-${i}`).value || `ผู้เล่น ${i}`;
            players.push({ id: i, name, money: 1500, position: 0, color: playerColors[i-1], inJail: false });
        }
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        buildBoard();
        updatePlayerUI();
        logStatus(`เริ่มเกม! ตาของ ${players[0].name} 🎲`);
    }

    /* ================= Board ================= */
    function buildBoard() {
        const container = document.getElementById('board-container');

        boardLayout.forEach((space, index) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `space-${index}`;

            let headerColor = '#e0e0e0';
            if(space.level === 'easy')   headerColor = '#81c784';
            if(space.level === 'medium') headerColor = '#64b5f6';
            if(space.level === 'hard')   headerColor = '#e57373';

            let r, c;
            if(index >= 0  && index <= 7)  { r = 9; c = 9 - index; }
            else if(index >= 8  && index <= 15) { r = 9 - (index-8);  c = 1; }
            else if(index >= 16 && index <= 23) { r = 1; c = 1 + (index-16); }
            else if(index >= 24 && index <= 31) { r = 1 + (index-24); c = 9; }

            cell.style.gridRow = r;
            cell.style.gridColumn = c;

            if(space.type === 'property') {
                // Extract emoji from name for display
                const nameParts = space.name.split(' ');
                const emoji = nameParts[0];
                const nameTxt = nameParts.slice(1).join(' ');
                cell.innerHTML = `
                    <div class="cell-header" style="background-color: ${headerColor}"></div>
                    <div class="cell-content">
                        <div class="cell-emoji">${emoji}</div>
                        <div>${nameTxt}</div>
                    </div>
                    <div class="cell-price">D ${space.price}</div>
                    <div class="owner-banner" id="owner-banner-${index}"></div>`;
            } else {
                cell.classList.add('corner');
                if(space.colorClass) cell.classList.add(space.colorClass);
                cell.innerHTML = `<div class="cell-content">${space.name}</div>`;
            }
            container.appendChild(cell);
        });

        players.forEach((p) => {
            const token = document.createElement('div');
            token.className = 'token';
            token.id = `token-${p.id}`;
            token.style.backgroundColor = p.color;
            container.appendChild(token);
        });

        updateTokensPosition();
    }

    /* ================= CHANGE 4: Top scoreboard UI ================= */
    function updatePlayerUI() {
        const row = document.getElementById('score-cards-row');
        row.innerHTML = '';
        players.forEach((p, i) => {
            const isActive = i === currentPlayerIndex ? 'active' : '';
            row.innerHTML += `
                <div class="score-card ${isActive}" id="player-card-${p.id}">
                    <div class="score-dot" style="background-color:${p.color}"></div>
                    <span class="score-name">${p.name}</span>
                    <span class="score-money" id="money-${p.id}">
                        <i class="fa-solid fa-coins" style="color:var(--gold)"></i> ${p.money} D
                    </span>
                </div>`;
        });
    }

    function updateTokensPosition() {
        players.forEach((p, i) => {
            const token = document.getElementById(`token-${p.id}`);
            const cell = document.getElementById(`space-${p.position}`);
            if(!cell) return;
            const rect = cell.getBoundingClientRect();
            const boardRect = document.getElementById('board-container').getBoundingClientRect();
            const left = rect.left - boardRect.left;
            const top  = rect.top  - boardRect.top;
            const offsetX = (i % 2) * 14 + 6;
            const offsetY = Math.floor(i / 2) * 14 + 6;
            token.style.left = `${left + offsetX}px`;
            token.style.top  = `${top  + offsetY}px`;
        });
    }

    /* ================= Money & Log ================= */
    function logStatus(msg) { document.getElementById('status-log').innerHTML = msg; }

    function animateMoney(playerId, amount) {
        const p = players.find(p => p.id === playerId);
        p.money += amount;
        const card = document.getElementById(`player-card-${playerId}`);
        const floatEl = document.createElement('div');
        floatEl.className = `float-text ${amount > 0 ? 'float-up' : 'float-down'}`;
        floatEl.innerText = amount > 0 ? `+${amount}` : `${amount}`;
        card.style.position = 'relative';
        card.appendChild(floatEl);
        document.getElementById(`money-${playerId}`).innerHTML =
            `<i class="fa-solid fa-coins" style="color:var(--gold)"></i> ${p.money} D`;
        setTimeout(() => floatEl.remove(), 2000);
    }

    /* ================= Gameplay ================= */
    function rollDice() {
        if(gameState !== 'playing') return;
        gameState = 'moving';
        document.getElementById('btn-roll').disabled = true;

        const diceEl = document.getElementById('dice-display');
        const diceEmojis = ['⚀','⚁','⚂','⚃','⚄','⚅'];
        let rolls = 0;
        const rollAnim = setInterval(() => {
            const v = Math.floor(Math.random()*6);
            diceEl.innerText = diceEmojis[v];
            rolls++;
            if(rolls > 10) {
                clearInterval(rollAnim);
                const finalValue = Math.floor(Math.random()*6) + 1;
                diceEl.innerText = diceEmojis[finalValue-1];
                const p = players[currentPlayerIndex];
                logStatus(`<strong>${p.name}</strong> ทอยได้ ${finalValue} แต้ม 🎲`);
                movePlayer(p, finalValue);
            }
        }, 100);
    }

    function movePlayer(player, spaces) {
        player.position += spaces;
        if(player.position >= boardLayout.length) {
            player.position -= boardLayout.length;
            setTimeout(() => {
                animateMoney(player.id, 200);
                logStatus(`<strong>${player.name}</strong> ผ่านจุดเริ่มต้น รับโบนัส 200 D 🚀`);
            }, 1000);
        }
        updateTokensPosition();
        setTimeout(() => evaluateSpace(player), 800);
    }

    function evaluateSpace(player) {
        const space = boardLayout[player.position];
        logStatus(`<strong>${player.name}</strong> เดินมาตกที่ <strong>${space.name.replace(/<br>/g,' ')}</strong>`);

        if(space.type === 'property') {
            if(space.owner === undefined) {
                currentPropertyToBuy = { player, space, index: player.position };
                if(space.hasQ) { gameState = 'answering'; triggerQuestion(space.level); }
                else promptBuyProperty();
            } else if(space.owner !== player.id) {
                const toll = Math.floor(space.price / 2);
                const owner = players.find(p => p.id === space.owner);
                animateMoney(player.id, -toll);
                animateMoney(owner.id, toll);
                logStatus(`<strong>${player.name}</strong> ถูกหัก ${toll} D เพราะไปตกช่องของ <strong>${owner.name}</strong>! 💸`);
                endTurn();
            } else {
                logStatus(`🏠 พักผ่อนในนครรัฐของตัวเอง...`);
                endTurn();
            }
        } else if(space.type === 'tax') {
            animateMoney(player.id, -space.amount);
            logStatus(`<strong>${player.name}</strong> เสียภาษี ${space.amount} D 💰`);
            endTurn();
        } else if(space.type === 'chance') {
            const chanceAmt = Math.random() > 0.5 ? 100 : -50;
            animateMoney(player.id, chanceAmt);
            logStatus(`<strong>${player.name}</strong> 📦 เปิดหีบสมบัติ ได้รับ ${chanceAmt > 0 ? '+'+chanceAmt : chanceAmt} D`);
            endTurn();
        } else if(player.position === 24) {
            player.position = 8;
            updateTokensPosition();
            logStatus(`<strong>${player.name}</strong> 💀 ถูกส่งตัวไปยังยมโลก!`);
            endTurn();
        } else {
            endTurn();
        }
    }

    /* ================= Questions & Buying ================= */
    function triggerQuestion(level) {
        const pool = questionBank[level];
        const qData = pool[Math.floor(Math.random() * pool.length)];
        let options = qData.options.map((opt, i) => ({ text: opt, isCorrect: i === qData.a }));
        options.sort(() => Math.random() - 0.5);

        document.getElementById('q-title').innerText = "🧠 คำถามเพื่ออารยธรรมกรีก";
        document.getElementById('q-text').innerText = qData.q;

        const optsContainer = document.getElementById('q-options');
        optsContainer.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => answerQuestion(opt.isCorrect);
            optsContainer.appendChild(btn);
        });
        document.getElementById('question-modal').style.display = 'flex';
        logStatus(`<strong>${players[currentPlayerIndex].name}</strong> กำลังตอบคำถาม... 🤔`);
    }

    function answerQuestion(isCorrect) {
        document.getElementById('question-modal').style.display = 'none';
        const p = currentPropertyToBuy.player;
        if(isCorrect) {
            animateMoney(p.id, 200);
            logStatus(`🎉 <strong>${p.name}</strong> ตอบถูก! รับรางวัล 200 D`);
            setTimeout(promptBuyProperty, 1500);
        } else {
            animateMoney(p.id, -50);
            logStatus(`❌ <strong>${p.name}</strong> ตอบผิด! โดนหัก 50 D และหมดสิทธิ์ซื้อที่ดินตานี้`);
            setTimeout(endTurn, 2000);
        }
    }

    function promptBuyProperty() {
        const p = currentPropertyToBuy.player;
        const sp = currentPropertyToBuy.space;
        if(p.money >= sp.price) {
            gameState = 'buying';
            showAlert(
                `🏛️ ซื้อนครรัฐ?`,
                `คุณต้องการซื้อ <strong>${sp.name.replace(/<br>/g,' ')}</strong> ในราคา ${sp.price} D หรือไม่?`,
                `<button class="btn" onclick="buyCurrentProperty()">✅ ซื้อเลย</button>
                 <button class="btn" style="background:#888;" onclick="skipBuyProperty()">❌ ข้าม</button>`
            );
        } else {
            showAlert(`แจ้งเตือน 💔`, `เงินไม่พอซื้อนครรัฐแห่งนี้!`, '');
            setTimeout(endTurn, 1500);
        }
    }

    function buyCurrentProperty() {
        const p = currentPropertyToBuy.player;
        const sp = currentPropertyToBuy.space;
        const idx = currentPropertyToBuy.index;
        animateMoney(p.id, -sp.price);
        sp.owner = p.id;
        const banner = document.getElementById(`owner-banner-${idx}`);
        if(banner) banner.style.backgroundColor = p.color;
        closeAlertModal();
        logStatus(`🏆 <strong>${p.name}</strong> ได้ครอบครอง ${sp.name.replace(/<br>/g,' ')}!`);
        setTimeout(endTurn, 1500);
    }

    function skipBuyProperty() {
        closeAlertModal();
        logStatus(`<strong>${currentPropertyToBuy.player.name}</strong> ปฏิเสธการซื้อที่ดิน`);
        endTurn();
    }

    function showAlert(title, text, htmlControls) {
        document.getElementById('alert-title').innerHTML = title;
        document.getElementById('alert-text').innerHTML = text;
        document.getElementById('alert-controls').innerHTML = htmlControls ||
            `<button class="btn" onclick="closeAlertModal()">ตกลง</button>`;
        document.getElementById('alert-modal').style.display = 'flex';
    }

    function closeAlertModal() { document.getElementById('alert-modal').style.display = 'none'; }

    /* ================= End Turn ================= */
    function endTurn() {
        document.getElementById('btn-roll').disabled = false;
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        gameState = 'playing';
        updatePlayerUI();
        setTimeout(() => {
            logStatus(`ตาของ <strong>${players[currentPlayerIndex].name}</strong> ทอยลูกเต๋า... 🎲`);
        }, 1000);
    }

    // Init
    generatePlayerInputs();
</script>
</body>
</html>
