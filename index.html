<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมบอร์ดอารยธรรมกรีก 🏛️⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============ GREEK KEY BORDER PATTERN ============ */
        .greek-border {
            background-image: 
                repeating-linear-gradient(90deg, #d4af37 0, #d4af37 10px, transparent 10px, transparent 20px),
                repeating-linear-gradient(0deg, #d4af37 0, #d4af37 10px, transparent 10px, transparent 20px),
                repeating-linear-gradient(45deg, transparent 0, transparent 10px, #d4af37 10px, #d4af37 20px),
                repeating-linear-gradient(-45deg, transparent 0, transparent 10px, #d4af37 10px, #d4af37 20px);
            background-size: 40px 40px, 40px 40px, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 0 0, 0 0;
            background-attachment: fixed;
            border: 4px solid #d4af37;
            padding: 2rem;
            border-radius: 12px;
        }

        /* ============ BACKGROUND ATHENS ============ */
        .athens-bg {
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(101, 67, 33, 0.15) 0%, transparent 50%);
            position: relative;
        }

        /* ============ ZEUS ANIMATION ⚡ ============ */
        @keyframes zeus-lightning {
            0% { opacity: 0; }
            10% { opacity: 1; }
            12% { opacity: 0; }
            15% { opacity: 1; }
            17% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes zeus-shake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-2deg); }
            50% { transform: translateY(0) rotate(2deg); }
            75% { transform: translateY(-5px) rotate(-1deg); }
        }

        .zeus-container {
            position: relative;
            display: inline-block;
            width: 150px;
            height: 200px;
            animation: zeus-shake 2s ease-in-out;
        }

        .zeus-body {
            font-size: 120px;
            text-align: center;
            line-height: 1;
        }

        .lightning {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 60px;
            animation: zeus-lightning 2s ease-in-out;
        }

        /* ============ CONTAINERS & CARDS ============ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 2rem;
            margin: 1.5rem 0;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.2rem;
            color: #ccc;
        }

        /* ============ BUTTONS ============ */
        button {
            font-family: 'Sarabun', sans-serif;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: 2px solid #d4af37;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background: #d4af37;
            color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-primary {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #d4af37, #c9a627);
            color: #1a1a2e;
            margin: 0.5rem 0;
        }

        .button-primary:hover {
            background: linear-gradient(135deg, #e0c341, #d4af37);
        }

        /* ============ INPUT FORMS ============ */
        input[type="text"],
        select {
            font-family: 'Sarabun', sans-serif;
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0 1rem 0;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.5);
        }

        label {
            display: block;
            margin-top: 1rem;
            color: #d4af37;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        /* ============ GAME MENU ============ */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .game-card {
            background: rgba(212, 175, 55, 0.05);
            border: 3px solid #d4af37;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .game-card:hover::before {
            left: 100%;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.4);
            background: rgba(212, 175, 55, 0.1);
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .game-card h3 {
            font-size: 1.5rem;
            color: #d4af37;
            margin-bottom: 0.5rem;
        }

        .game-card p {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* ============ GAME BOARD UI ============ */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(212, 175, 55, 0.05);
            border: 2px dashed #d4af37;
            border-radius: 12px;
        }

        .game-tile {
            aspect-ratio: 1;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-tile:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }

        .tile-emoji {
            font-size: 3rem;
        }

        .tile-text {
            font-size: 0.85rem;
            color: #d4af37;
            font-weight: 600;
            text-align: center;
            margin-top: 0.5rem;
        }

        /* ============ QUIZ POPUP ============ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #d4af37;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 16px 48px rgba(212, 175, 55, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h2 {
            color: #d4af37;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .modal p {
            color: #ccc;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .quiz-options {
            display: grid;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .quiz-option {
            width: 100%;
            padding: 0.8rem;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid transparent;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            transition: all 0.3s ease;
            text-align: left;
        }

        .quiz-option:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .quiz-option.correct {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
        }

        .quiz-option.incorrect {
            background: rgba(244, 67, 54, 0.3);
            border-color: #f44336;
        }

        /* ============ PLAYER PAWNS ============ */
        .players-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .player-pawn {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            position: relative;
        }

        .pawn-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .player-name {
            color: #d4af37;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .player-score {
            color: #ccc;
            font-size: 0.9rem;
        }

        .player-progress {
            width: 100%;
            height: 8px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            margin-top: 0.8rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #c9a627);
            transition: width 0.3s ease;
        }

        /* ============ GAME SPECIFIC ============ */
        .uno-card {
            width: 100px;
            height: 140px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }

        .uno-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .card-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .card-blue { background: linear-gradient(135deg, #3498db, #2980b9); }
        .card-yellow { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .card-green { background: linear-gradient(135deg, #27ae60, #229954); }

        .werewolf-info {
            background: rgba(212, 175, 55, 0.1);
            border-left: 4px solid #d4af37;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
        }

        .game-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-box {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            color: #d4af37;
            font-weight: 700;
        }

        .stat-label {
            color: #ccc;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* ============ LEARNING PROGRESSION ============ */
        .learning-log {
            background: rgba(212, 175, 55, 0.05);
            border: 2px dashed #d4af37;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .learning-item {
            padding: 0.8rem;
            margin: 0.5rem 0;
            background: rgba(212, 175, 55, 0.1);
            border-left: 4px solid #d4af37;
            border-radius: 4px;
            color: #ccc;
        }

        .learning-item.unlocked {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .learning-emoji {
            margin-right: 0.5rem;
        }

        /* ============ DESCRIPTION TOOLTIP ============ */
        .tooltip {
            position: relative;
            display: inline-block;
            cursor: help;
            border-bottom: 2px dotted #d4af37;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 250px;
            background-color: rgba(0, 0, 0, 0.95);
            color: #d4af37;
            text-align: center;
            border-radius: 8px;
            padding: 1rem;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -125px;
            opacity: 0;
            transition: opacity 0.3s;
            border: 2px solid #d4af37;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .game-grid {
                grid-template-columns: 1fr;
            }

            .game-board {
                grid-template-columns: repeat(3, 1fr);
            }

            .modal {
                width: 95%;
            }
        }
    </style>
</head>

        function MonopolyGame() {
            const [ownedCities, setOwnedCities] = React.useState(['เอเธนส์']);

            const cities = [
                { emoji: '🏛️', name: 'เอเธนส์', price: 200, trait: 'ประชาธิปไตย' },

            const handleBuyCity = (city) => {

                                    }}

                                    <div className="tile-emoji">{city.emoji}</div>

                                    {ownedCities.includes(city.name) ? (

        function TicketToRideGame() {
            const [routes, setRoutes] = React.useState([]);
            const [ships, setShips] = React.useState(10);

            const availableRoutes = [
                { from: 'เอเธนส์', to: 'คอรินท์', distance: 50, cargo: '🫒 น้ำมันมะกอก' },
                { from: 'เอเธนส์', to: 'ทรอย', distance: 100, cargo: '🍷 ไวน์' },
                { from: 'คอรินท์', to: 'ซิซิลี', distance: 80, cargo: '🏺 เครื่องปั้นดินเผา' }
            ];

            const handleClaimRoute = (route) => {
                if (ships >= route.distance / 25) {
                    setRoutes([...routes, route]);
                    setShips(ships - Math.ceil(route.distance / 25));
                }
            };

            return (
                <div className="card">
                    <h3 style={{ color: '#d4af37', marginBottom: '1rem' }}>
                        🚢 สายไหมทางทะเล
                    </h3>

                    <div className="tooltip">
                        <span>🗺️ Mediterranean Trade Routes</span>
                        <span className="tooltiptext">เส้นทางการค้าหลักของชาวกรีกผ่านทะเลเมดิเตอร์เรเนียน</span>
                    </div>

                    <div style={{ marginTop: '1.5rem' }}>
                        <div className="game-stats">
                            <div className="stat-box">
                                <div className="stat-value">{ships}</div>
                                <div className="stat-label">เรือเหลือ 🚢</div>
                            </div>
                            <div className="stat-box">
                                <div className="stat-value">{routes.length}</div>
                                <div className="stat-label">เส้นทางที่สร้าง</div>
                            </div>
                            <div className="stat-box">
                                <div className="stat-value">{routes.length * 10}</div>
                                <div className="stat-label">คะแนน</div>
                            </div>
                        </div>

                        <p style={{ color: '#d4af37', marginTop: '2rem', marginBottom: '1rem', fontWeight: 600 }}>
                            🛤️ เส้นทางที่สามารถสร้างได้:
                        </p>

                        {availableRoutes.map((route, idx) => (
                            <div 
                                key={idx}
                                style={{
                                    background: routes.some(r => r.from === route.from && r.to === route.to) 
                                        ? 'rgba(76, 175, 80, 0.2)' 
                                        : 'rgba(212, 175, 55, 0.1)',
                                    padding: '1rem',
                                    marginBottom: '1rem',
                                    borderRadius: '8px',
                                    border: '2px solid #d4af37',
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center'
                                }}
                            >
                                <div>
                                    <p style={{ color: '#d4af37', fontWeight: 600, marginBottom: '0.3rem' }}>
                                        {route.from} → {route.to}
                                    </p>
                                    <p style={{ fontSize: '0.9rem', color: '#ccc' }}>
                                        ระยะ: {route.distance}km | สินค้า: {route.cargo}
                                    </p>
                                </div>
                                <button 
                                    onClick={() => handleClaimRoute(route)}
                                    disabled={ships < Math.ceil(route.distance / 25) || routes.some(r => r.from === route.from && r.to === route.to)}
                                    style={{
                                        opacity: ships < Math.ceil(route.distance / 25) || routes.some(r => r.from === route.from && r.to === route.to) ? 0.5 : 1,
                                        cursor: ships < Math.ceil(route.distance / 25) || routes.some(r => r.from === route.from && r.to === route.to) ? 'not-allowed' : 'pointer'
                                    }}
                                >
                                    {routes.some(r => r.from === route.from && r.to === route.to) 
                                        ? '✓ สร้างแล้ว' 
                                        : `สร้าง (ต้อง ${Math.ceil(route.distance / 25)} เรือ)`
                                    }
                                </button>
                            </div>
                        ))}

                        <div style={{ 
                            marginTop: '2rem',
                            padding: '1rem',
                            background: 'rgba(212, 175, 55, 0.1)',
                            borderRadius: '8px',
                            borderLeft: '4px solid #d4af37'
                        }}>
                            <p style={{ color: '#d4af37', fontWeight: 600, marginBottom: '0.5rem' }}>
                                📚 สมุดบันทึกการค้า:
                            </p>
                            <p style={{ fontSize: '0.95rem', lineHeight: '1.5' }}>
                                🫒 <strong>เอเธนส์</strong> ผลิตน้ำมันมะกอกมากที่สุด | 
                                🍷 <strong>ทรอย</strong> มีไวน์ดีเด่น | 
                                🏺 <strong>คอรินท์</strong> ผลิตเครื่องปั้นดินเผา
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ MAIN APP COMPONENT ============
        class App extends React.Component {
            constructor(props) {
                super(props);
                this.state = { page: 'home' };
                App.setState = this.setState.bind(this);
            }

            render() {
                const { page } = this.state;

                return (
                    <div>
                        {page === 'home' && <HomePage />}
                        {page === 'menu' && <GameMenu />}
                        {page === 'game-UNO' && <GameBoard gameId="UNO" />}
                        {page === 'game-Werewolf' && <GameBoard gameId="Werewolf" />}
                        {page === 'game-เกมเศรษฐี' && <GameBoard gameId="เกมเศรษฐี" />}
                        {page === 'game-Ticket to Ride' && <GameBoard gameId="Ticket to Ride" />}
                    </div>
                );
            }
        }

        // ============ RENDER APP ============
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
